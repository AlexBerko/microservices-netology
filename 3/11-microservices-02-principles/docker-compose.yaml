services:
  storage:
    image: pgsty/minio:latest
    container_name: storage
    command: server /data
    restart: always
    expose: 
      - 9000
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-STORAGE_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: pgsty/mc:latest
    container_name: createbuckets
    depends_on:
      - storage
    restart: on-failure
    entrypoint: > 
      /bin/sh -c "      
      /usr/bin/mc alias set storage http://storage:9000 ${Storage_AccessKey-STORAGE_ACCESS_KEY} ${Storage_Secret-STORAGE_SECRET_KEY} &&
      /usr/bin/mc mb --ignore-existing storage/${Storage_Bucket:-data} &&
      /usr/bin/mc anonymous set download storage/${Storage_Bucket:-data} &&
      exit 0;
      "

  uploader:
    container_name: uploader
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    expose: 
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      S3_ACCESS_SECRET: ${Storage_Secret:-STORAGE_SECRET_KEY}
      S3_BUCKET: ${Storage_Bucket:-STORAGE_BUCKET}

  security:
    container_name: security
    build: ./security
    expose:
      - 3000
    environment:
      PORT: 3000

  gateway:
    image: nginx:alpine
    container_name: gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - storage
      - uploader
      - security

  #----------------------
  #       LOGGING 
  #----------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-qwerty123456}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  setup_elasticsearch:
    image: curlimages/curl:latest
    container_name: setup
    depends_on:
      - elasticsearch
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-qwerty123456}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-qwerty123456}
    command: >
      sh -c "
        sleep 5 &&
        echo 'Setting password for kibana_system user...' &&
        curl -s -u elastic:$${ELASTIC_PASSWORD} -X POST -H 'Content-Type: application/json' http://elasticsearch:9200/_security/user/kibana_system/_password -d '{\"password\":\"'$${KIBANA_PASSWORD}'\"}' &&
        echo 'Creating admin user...' &&
        curl -s -u elastic:$${ELASTIC_PASSWORD} -X POST -H 'Content-Type: application/json' http://elasticsearch:9200/_security/user/admin -d '{\"password\":\"'$${ELASTIC_PASSWORD}'\",\"roles\":[\"superuser\"],\"full_name\":\"Admin User\"}' &&
        echo 'Initialization completed.'
      "
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-qwerty123456}
    ports:
      - "8081:5601"
    depends_on:
      - setup_elasticsearch

  vector:
    image: timberio/vector:0.40.0-debian
    container_name: vector
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - gateway



  #----------------------
  #       METRICS 
  #----------------------

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - uploader
      - security
      - storage


  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "8082:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwerty123456
    depends_on:
      - prometheus



volumes:
  data:
  prometheus-data:
  grafana_data:
  es_data: