events {
    worker_connections 1024;
}

http {
    server {
        listen      80;
        server_name _;
        
        location /v1/register {
            limit_except POST {
                deny all;
            }

            proxy_pass http://security:3000;
        }

        location /v1/token {
            limit_except POST {
                deny all;
            }

            proxy_pass http://security:3000;
        }

        location /v1/user {
            limit_except GET {
                deny all;
            }

            auth_request /_token_validation;

            proxy_pass http://security:3000/v1/user;
        }

        location /v1/upload {
            limit_except POST {
                deny all;
            }

            auth_request /_token_validation;

            proxy_pass http://uploader:3000/v1/upload;
        }

        location /v1/user/ {
            limit_except GET {
                deny all;
            }
            

            auth_request /_token_validation;

            proxy_cache_convert_head off;
            proxy_set_header    Host $http_host;
            proxy_pass          http://storage:9000/images/;
        }


        location /_token_validation {
            internal;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_pass http://security:3000/v1/token/validation;
        }
    }
}